&lt;script&gt;
(()=&gt;{
  const key=&#x27;trip-mate:sketch:ai-sidebar:v1&#x27;;
  const workspace=document.getElementById(&#x27;workspace&#x27;),assistant=document.getElementById(&#x27;assistant&#x27;),launcher=document.getElementById(&#x27;launcher&#x27;),label=document.getElementById(&#x27;launcher-label&#x27;),input=document.getElementById(&#x27;message&#x27;),messagesElement=document.getElementById(&#x27;messages&#x27;),pendingElement=document.getElementById(&#x27;pending&#x27;),hint=document.getElementById(&#x27;context-hint&#x27;),welcome=document.getElementById(&#x27;welcome&#x27;),conversation=document.getElementById(&#x27;conversation&#x27;),tripPane=document.getElementById(&#x27;trip-pane&#x27;);

  try {const value=JSON.parse(sessionStorage.getItem(key)||&#x27;null&#x27;);if(value?.version===1&amp;&amp;Array.isArray(value.messages)&amp;&amp;value.messages.length&lt;=40&amp;&amp;value.messages.every(m=&gt;[&#x27;user&#x27;,&#x27;model&#x27;,&#x27;status&#x27;].includes(m.role)&amp;&amp;typeof m.text===&#x27;string&#x27;&amp;&amp;m.text.length&lt;=5000))messages=value.messages;} catch {saved=false;}
  function save(){try {if(messages.length)sessionStorage.setItem(key,JSON.stringify({version:1,messages:messages.slice(-40)}));else sessionStorage.removeItem(key);saved=true;}catch{saved=false;}storageStatus.textContent=saved?&#x27;本分頁暫存（樣稿）&#x27;:&#x27;僅保留當次對話&#x27;;}

  function syncMode(){const mobile=matchMedia(&#x27;(max-width:1000px)&#x27;).matches;if(mobile&amp;&amp;open){assistant.setAttribute(&#x27;role&#x27;,&#x27;dialog&#x27;);assistant.setAttribute(&#x27;aria-modal&#x27;,&#x27;true&#x27;);tripPane.inert=true;document.querySelector(&#x27;.mobile-nav&#x27;).inert=true;}else{assistant.removeAttribute(&#x27;role&#x27;);assistant.removeAttribute(&#x27;aria-modal&#x27;);tripPane.inert=false;document.querySelector(&#x27;.mobile-nav&#x27;).inert=false;}}
  function setOpen(value){open=value;workspace.classList.toggle(&#x27;ai-open&#x27;,value);assistant.hidden=!value;launcher.hidden=value;launcher.setAttribute(&#x27;aria-expanded&#x27;,String(value));syncMode();if(!value)launcher.focus({preventScroll:true});}
  function cancelChange(){pending=false;pendingElement.hidden=true;pendingElement.replaceChildren();messages.push({role:&#x27;status&#x27;,text:&#x27;已取消變更，未修改旅程。&#x27;});save();render();}
  function prepareChange(){pending=true;pendingElement.hidden=false;pendingElement.innerHTML=&#x27;&lt;section class=&quot;change&quot; aria-label=&quot;待確認變更&quot;&gt;&lt;h3&gt;確認行程變更&lt;/h3&gt;&lt;p class=&quot;dim&quot;&gt;2027/05/02　大阪城散步&lt;/p&gt;&lt;p&gt;開始時間　10:00 → 10:30&lt;/p&gt;&lt;p class=&quot;dim&quot;&gt;此為預覽，確認只會改變畫面。&lt;/p&gt;&lt;div class=&quot;change-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;button secondary&quot; data-reject&gt;取消變更&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;button&quot; data-approve&gt;確認（預覽）&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&#x27;;pendingElement.querySelector(&#x27;[data-reject]&#x27;).onclick=cancelChange;pendingElement.querySelector(&#x27;[data-approve]&#x27;).onclick=()=&gt;{pending=false;pendingElement.hidden=true;document.getElementById(&#x27;osaka-time&#x27;).textContent=&#x27;10:30&#x27;;messages.push({role:&#x27;status&#x27;,text:&#x27;已展示確認後的畫面，未寫入任何試算表。&#x27;});save();render();};render();}
  function ask(text){if(pending||!text.trim())return;messages.push({role:&#x27;user&#x27;,text});input.value=&#x27;&#x27;;attachment=false;document.getElementById(&#x27;attachment&#x27;).hidden=true;
    if(/10:30|改成|調整/.test(text)){messages.push({role:&#x27;model&#x27;,text:&#x27;可以將第二天「大阪城散步」的時間由 10:00 調整為 10:30，請確認下方變更。&#x27;});prepareChange();return;}
    let reply;if(/剛剛|記得|上下文/.test(text)){const previous=messages.slice(0,-1).filter(m=&gt;m.role===&#x27;user&#x27;);reply=previous.length?&#x27;這個樣稿仍記得你上一個問題：「&#x27;+previous.at(-1).text+&#x27;」。&#x27;:&#x27;這是新的對話，目前沒有先前的提問紀錄。&#x27;;}
    else if(/第二天|第 2 天/.test(text))reply=&#x27;第二天是 2027/05/02。目前安排 10:00 在大阪城公園散步，你也可以在左側切換到 D2 查看。&#x27;;

    messages.push({role:&#x27;model&#x27;,text:reply});save();render();}

  document.getElementById(&#x27;clear&#x27;).onclick=()=&gt;{messages=[];pending=false;input.value=&#x27;&#x27;;attachment=false;pendingElement.hidden=true;pendingElement.replaceChildren();document.getElementById(&#x27;attachment&#x27;).hidden=true;save();render();hint.hidden=false;hint.textContent=&#x27;對話與上下文已清空，旅程資料不受影響。&#x27;;input.focus();};
  document.getElementById(&#x27;upload&#x27;).onclick=()=&gt;{attachment=true;document.getElementById(&#x27;attachment&#x27;).hidden=false;};document.getElementById(&#x27;remove-attachment&#x27;).onclick=()=&gt;{attachment=false;document.getElementById(&#x27;attachment&#x27;).hidden=true;};
  document.querySelectorAll(&#x27;[data-day]&#x27;).forEach(button=&gt;button.onclick=()=&gt;{document.querySelectorAll(&#x27;[data-day]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b===button)));document.querySelectorAll(&#x27;[data-date]&#x27;).forEach(day=&gt;day.hidden=button.dataset.day!==&#x27;all&#x27;&amp;&amp;button.dataset.day!==day.dataset.date);});
  const detailsButton=document.getElementById(&#x27;details&#x27;),details=document.getElementById(&#x27;inline-details&#x27;);detailsButton.onclick=()=&gt;{details.hidden=!details.hidden;detailsButton.setAttribute(&#x27;aria-expanded&#x27;,String(!details.hidden));detailsButton.textContent=details.hidden?&#x27;查看更多&#x27;:&#x27;收合詳情&#x27;;};
  assistant.addEventListener(&#x27;keydown&#x27;,event=&gt;{if(event.key===&#x27;Escape&#x27;){event.preventDefault();setOpen(false);}if(event.key===&#x27;Tab&#x27;&amp;&amp;matchMedia(&#x27;(max-width:1000px)&#x27;).matches){const controls=Array.from(assistant.querySelectorAll(&#x27;button:not(:disabled),textarea:not(:disabled)&#x27;)).filter(el=&gt;el.getClientRects().length);const first=controls[0],last=controls.at(-1);if(event.shiftKey&amp;&amp;document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&amp;&amp;document.activeElement===last){event.preventDefault();first.focus();}}});
  matchMedia(&#x27;(max-width:1000px)&#x27;).addEventListener(&#x27;change&#x27;,syncMode);save();render();syncMode();
})();
&lt;/script&gt;

"></iframe></div></main><script>(()=>{const frame=document.getElementById('preview'),shell=document.getElementById('frame-shell'),desktop=document.getElementById('desktop'),mobile=document.getElementById('mobile');function mode(phone){shell.classList.toggle('mobile',phone);desktop.setAttribute('aria-pressed',String(!phone));mobile.setAttribute('aria-pressed',String(phone));}desktop.onclick=()=>mode(false);mobile.onclick=()=>mode(true);document.getElementById('reload').onclick=()=>{frame.srcdoc=frame.getAttribute('srcdoc');};})();</script></body></html>

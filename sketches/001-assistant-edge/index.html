<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 助手設計預覽</title><style>
/* Values copied from the existing trip-mate theme; sketches only. */
:root {
  --paper: #fffaf2;
  --line: #dfd0bf;
  --muted: #796c60;
  --brown: #795d48;
  --orange: #a95e38;
  --page: #f3ebdf;
  --ink: #44372e;
  --font: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
}

*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:3px}svg{width:22px;height:22px;flex:none}h1,h2,h3,p{margin:0}p{line-height:1.7}.site-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{font-weight:700;font-size:18px;color:var(--brown)}.preview-label{font-size:11px;color:var(--muted)}main{max-width:1000px;margin:auto;padding:24px 20px 190px}.trip-title{font-size:27px;line-height:1.4}.trip-meta{font-size:13px;color:var(--muted);margin-top:8px}.tabs{display:flex;gap:24px;margin:24px 0}.tabs span{font-size:13px;color:var(--muted);padding:8px 0}.tabs .active{color:var(--brown);border-bottom:2px solid var(--brown)}.section-title{font-size:19px;margin:20px 0}.day{display:flex;align-items:baseline;gap:12px;margin:16px 0}.day strong{font-size:27px;color:var(--brown)}.day span{font-size:13px;color:var(--muted)}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}.time{font-size:14px;color:var(--brown)}.card{padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.card h3{font-size:16px;line-height:1.5}.card p{font-size:13px;color:var(--muted);margin-top:4px}.travel{background:color-mix(in srgb,var(--paper) 93%,#487aa0);border-color:color-mix(in srgb,var(--line) 70%,#487aa0)}.activity{background:color-mix(in srgb,var(--paper) 94%,#607d57);border-color:color-mix(in srgb,var(--line) 70%,#607d57)}.bottom-nav{display:none}.launcher{position:fixed;right:24px;bottom:24px;display:flex;gap:8px;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border:1px solid var(--brown);border-radius:8px;color:var(--paper);background:var(--brown);z-index:3}.launcher:hover{background:var(--orange);border-color:var(--orange)}.launcher[hidden]{display:none}.pending{display:none;background:var(--paper);color:var(--brown);font-size:11px;padding:1px 5px;border-radius:4px}.has-pending .pending{display:inline-block}.tooltip{display:none}.launcher.compact{width:52px;height:52px;padding:12px}.compact .label{display:none}.compact:hover .tooltip,.compact:focus-visible .tooltip{display:block;position:absolute;right:calc(100% + 8px);white-space:nowrap;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--brown);padding:6px 10px;font-size:12px}.compact.resumed,.compact.has-pending{width:auto}.compact.resumed .label,.compact.has-pending .label{display:inline}.launcher.edge{right:0;bottom:36%;min-height:84px;padding:10px 8px;flex-direction:column;gap:4px;border-radius:8px 0 0 8px;border-right:0;background:var(--paper);color:var(--brown);width:54px}.edge .label{white-space:pre-line;font-size:12px;line-height:1.4;text-align:center;max-width:36px}.edge .pending{padding:0;font-size:10px;color:var(--orange)}dialog{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--paper);color:var(--ink);width:min(560px,calc(100% - 32px));height:min(620px,calc(100dvh - 40px));max-height:calc(100dvh - 24px);overflow:hidden;margin:auto}dialog[open]{display:flex;flex-direction:column}dialog::backdrop{background:color-mix(in srgb,var(--ink) 35%,transparent)}dialog.compact-chat{inset:auto 24px 24px auto;margin:0;width:min(400px,calc(100% - 32px));height:min(560px,calc(100dvh - 40px))}dialog.edge-chat{inset:0 0 0 auto;margin:0;border-radius:8px 0 0 8px;width:min(440px,100%);height:100dvh;max-height:100dvh}.chat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:24px 24px 12px;flex:none;background:var(--paper)}.chat-title{font-size:20px;line-height:1.4}.chat-subtitle{margin-top:4px;color:var(--muted);font-size:12px}.header-actions{display:flex;flex:none}.icon-button{display:grid;place-items:center;width:36px;height:36px;padding:6px;border:0;border-radius:4px;background:transparent;color:var(--brown)}.icon-button:hover{background:var(--page)}.icon-button svg{width:18px;height:18px}.chat-content{padding:0 24px 12px;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}.chat-content>p{font-size:14px;color:var(--muted);margin:8px 0 12px}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button,.secondary{padding:8px 12px;color:var(--brown);background:var(--paper);border:1px solid var(--line);border-radius:4px;font-size:13px}.quick button:hover,.secondary:hover{background:var(--page)}.notice{font-size:12px!important;color:var(--muted);margin-top:16px!important}.change{margin-top:16px;padding:8px;border:1px solid var(--line);border-radius:8px}.change h3{font-size:15px}.change p{font-size:13px;margin-top:8px;line-height:1.7}.change .meta{color:var(--muted);font-size:12px}.change-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}.primary{padding:8px 12px;background:var(--brown);color:var(--paper);border:1px solid var(--brown);border-radius:4px;font-size:13px}.composer{padding:0 24px 24px;flex:none}.composer label{display:block;margin-bottom:4px;font-size:13px}.composer textarea{display:block;width:100%;min-height:72px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:inherit;resize:vertical}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}.composer-status{font-size:11px;color:var(--muted)}.model-reply{font-size:14px;line-height:1.8;margin-top:12px;white-space:pre-wrap}.mock-user{text-align:right;color:var(--brown);font-size:13px;margin-top:12px}.success{color:var(--brown);font-size:13px;margin-top:12px}html:has(dialog[open]){overflow:hidden}@media(max-width:700px){.site-header{padding:18px 16px}main{padding:20px 16px 180px}.trip-title{font-size:26px}.tabs{display:none}.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;align-items:center;min-height:68px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);z-index:2}.bottom-nav span{display:grid;justify-items:center;gap:4px;color:var(--muted);font-size:11px}.bottom-nav svg{width:19px;height:19px}.bottom-nav .active{color:var(--brown)}.launcher{right:16px;bottom:calc(84px + env(safe-area-inset-bottom))}.launcher.edge{right:0;bottom:calc(100px + env(safe-area-inset-bottom))}.card{padding:12px}dialog,dialog.compact-chat,dialog.edge-chat{inset:0;margin:auto;width:calc(100% - 16px);height:calc(100dvh - 24px);max-height:calc(100dvh - 16px);border-radius:8px}.chat-head{padding:20px 20px 12px}.chat-content{padding:0 20px 12px}.composer{padding:0 20px 20px}.composer textarea{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}@media(forced-colors:active){.launcher,.primary{background:ButtonFace;color:ButtonText;border-color:ButtonText}}
</style></head><body>
<header class="site-header"><span class="brand">蕃薯旅遊團</span><span class="preview-label">介面預覽</span></header>
<main><h1 class="trip-title">大阪三日｜範例旅程</h1><p class="trip-meta">日本・大阪　2027/05/01 - 2027/05/03</p><div class="tabs"><span>總覽</span><span class="active">行程</span><span>公積金</span><span>支出</span><span>進度</span></div><h2 class="section-title">每日行程</h2><div class="day"><strong>DAY 1</strong><span>5/1 (六)</span></div><div class="timeline"><article class="event"><span class="time">09:00</span><div class="card travel"><h3>搭機出發</h3><p>桃園機場</p></div></article><article class="event"><span class="time">15:00</span><div class="card"><h3>飯店入住</h3><p>範例飯店</p></div></article></div><div class="day"><strong>DAY 2</strong><span>5/2 (日)</span></div><div class="timeline"><article class="event"><span class="time">10:00</span><div class="card activity"><h3>大阪城散步</h3><p>大阪城公園</p></div></article></div></main>
<nav class="bottom-nav" aria-label="旅程功能"><span>總覽</span><span class="active">行程</span><span>公積金</span><span>支出</span><span>進度</span></nav>
<button id="launcher" class="launcher edge" type="button" aria-label="開啟 AI 助手" aria-haspopup="dialog" aria-expanded="false"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 5A7 7 0 0 0 5 11c0 5 7 10 7 10s5-3.8 6.5-8"/><circle cx="11.5" cy="10.5" r="2"/><path d="M19 2l1 2.5L22.5 6 20 7l-1 2.5L18 7l-2.5-1L18 4.5Z"/></svg><span class="label">AI 助手</span><span class="pending">待確認</span><span class="tooltip" aria-hidden="true">AI 助手</span></button>
<dialog id="chat" class="edge-chat" aria-labelledby="chat-title"><header class="chat-head"><div><h2 class="chat-title" id="chat-title">AI 行程助手</h2><p class="chat-subtitle">大阪三日｜範例旅程</p></div><div class="header-actions"><button class="icon-button" id="minimize" aria-label="縮小並保留對話"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14h14"/></svg></button><button class="icon-button" id="close" aria-label="結束對話並關閉"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header><div class="chat-content" id="content"></div><form class="composer" id="composer"><label for="message">訊息 *</label><textarea id="message" rows="3" placeholder="詢問或調整目前行程"></textarea><div class="composer-bottom"><span class="composer-status">互動樣稿，未連接 AI</span><button class="primary" type="submit">送出（預覽）</button></div></form></dialog>
<script>
(()=>{const button=document.getElementById('launcher'),chat=document.getElementById('chat'),content=document.getElementById('content'),input=document.getElementById('message');let resumed=false,pending=false;
const intro=()=>{content.replaceChildren();const p=document.createElement('p');p.textContent='想先查看哪一部分行程？';content.append(p);const quick=document.createElement('div');quick.className='quick';['總結行程','第二天有哪些行程','調整第二天時間'].forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=()=>{if(i===2){pending=true;renderPending();update();}else{const reply=document.createElement('p');reply.className='model-reply';reply.textContent=i===0?'範例旅程共 3 天。第一天搭機與入住飯店，第二天安排大阪城散步。':'第二天 10:00 大阪城散步。';content.append(reply);}};quick.append(b);});content.append(quick);};
const update=()=>{button.classList.toggle('resumed',resumed);button.classList.toggle('has-pending',pending);button.querySelector('.label').textContent=button.classList.contains('edge')?(resumed?'繼續\n對話':'AI\n助手'):(resumed?'繼續對話':'AI 助手');button.setAttribute('aria-label',pending?'開啟 AI 助手，尚有待確認變更':resumed?'繼續 AI 對話':'開啟 AI 助手');};
function renderPending(){content.replaceChildren();const panel=document.createElement('section');panel.className='change';panel.innerHTML='<h3>確認行程變更</h3><p class="meta">2027/05/02　大阪城散步</p><p>開始時間：10:00 → 10:30</p><p class="meta">此為互動預覽，不會儲存。</p><div class="change-actions"><button type="button" class="secondary" data-cancel>取消變更</button><button type="button" class="primary" data-confirm>確認（預覽）</button></div>';panel.querySelector('[data-cancel]').onclick=()=>{pending=false;intro();update();};panel.querySelector('[data-confirm]').onclick=()=>{pending=false;intro();const p=document.createElement('p');p.className='success';p.textContent='已展示確認操作；未寫入任何資料。';content.append(p);update();};content.append(panel);}
function show(){button.hidden=true;button.setAttribute('aria-expanded','true');chat.showModal();}function minimize(){chat.close();resumed=true;button.hidden=false;button.setAttribute('aria-expanded','false');update();button.focus({preventScroll:true});}function close(){chat.close();resumed=false;pending=false;input.value='';intro();button.hidden=false;button.setAttribute('aria-expanded','false');update();button.focus({preventScroll:true});}
button.onclick=show;document.getElementById('minimize').onclick=minimize;document.getElementById('close').onclick=close;chat.addEventListener('cancel',e=>{e.preventDefault();close();});document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;const p=document.createElement('p');p.className='mock-user';p.textContent=input.value;content.append(p);const r=document.createElement('p');r.className='notice';r.textContent='這是介面預覽，未向模型送出訊息。';content.append(r);input.value='';};window.addEventListener('message',event=>{if(event.source!==parent||!event.data?.previewState)return;chat.close();button.hidden=false;button.setAttribute('aria-expanded','false');resumed=event.data.previewState!=='idle';pending=event.data.previewState==='pending';input.value='';if(pending)renderPending();else intro();update();if(event.data.open)show();});intro();update();
})();
</script></body></html>
